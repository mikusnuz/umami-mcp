# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      umamiMode:
        type: string
        enum: [self-hosted, cloud]
        description: Optional deployment mode override; otherwise inferred from the URL
      umamiUrl:
        type: string
        description: Your Umami instance URL (e.g. https://analytics.example.com)
      umamiUsername:
        type: string
        description: Login username (for self-hosted)
      umamiPassword:
        type: string
        description: Login password (for self-hosted)
      umamiApiKey:
        type: string
        description: Bearer API key for Umami Cloud or self-hosted Umami 3.4+
      umamiCollectorUrl:
        type: string
        description: Optional separate collection endpoint
  commandFunction:
    |-
    config => ({ command: 'npx', args: ['-y', '@mikusnuz/umami-mcp'], env: { UMAMI_MODE: config.umamiMode || '', UMAMI_URL: config.umamiUrl || '', UMAMI_USERNAME: config.umamiUsername || '', UMAMI_PASSWORD: config.umamiPassword || '', UMAMI_API_KEY: config.umamiApiKey || '', UMAMI_COLLECTOR_URL: config.umamiCollectorUrl || '' } })
